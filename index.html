function joursDepuis(timestamp) {
  if (!timestamp) return 0;
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return (Date.now() - date.getTime()) / (1000 * 60 * 60 * 24);
}

function AuthGate() {
  const [authUser, setAuthUser] = useState(null);
  const [userDoc, setUserDoc] = useState(null);
  const [pret, setPret] = useState(false);
  const [dureeEssaiGlobale, setDureeEssaiGlobale] = useState(DUREE_ESSAI_JOURS_DEFAUT);

  useEffect(() => {
    if (!firebaseConfigueValide || !db) return;
    db.collection("config").doc("general").get()
      .then((snap) => { if (snap.exists && snap.data().dureeEssaiJours) setDureeEssaiGlobale(Number(snap.data().dureeEssaiJours)); })
      .catch(() => {});
  }, []);

  useEffect(() => {
    if (!firebaseConfigueValide) { setPret(true); return; }
    const unsubscribe = auth.onAuthStateChanged(async (u) => {
      setAuthUser(u);
      if (u) {
        try {
          const ref = db.collection("users").doc(u.uid);
          let snap = await ref.get();
          if (!snap.exists) {
            await ref.set({ email: u.email, createdAt: firebase.firestore.FieldValue.serverTimestamp(), freeAccess: false, locked: false });
            snap = await ref.get();
          }
          setUserDoc(snap.data());
        } catch (err) {
          setUserDoc({ email: u.email, createdAt: null, freeAccess: false, locked: false });
        }
      } else {
        setUserDoc(null);
      }
      setPret(true);
    });
    return () => unsubscribe();
  }, []);

  if (!firebaseConfigueValide) {
    return (
      <>
        <div className="bg-amber-500 text-slate-950 text-[11px] text-center py-1 font-semibold">
          Mode local — configuration Firebase manquante. Comptes désactivés.
        </div>
        <MonCarnetDeBord user={null} isAdmin={true} onLogout={null} />
      </>
    );
  }

  if (!pret) return <EcranMessage titre="Chargement…" message="Un instant." />;
  if (!authUser) return <EcranConnexion />;

  const isAdmin = ADMIN_EMAILS.includes(authUser.email);
  const locked = userDoc?.locked === true;
  const dureeEssaiApplicable = userDoc?.dureeEssaiPersonnalisee ?? dureeEssaiGlobale;
  const essaiEcoule = joursDepuis(userDoc?.createdAt) > dureeEssaiApplicable;
  const accesAutorise = isAdmin || userDoc?.freeAccess === true || userDoc?.abonnementActif === true || !essaiEcoule;

  const deconnexion = () => auth.signOut();

  if (locked && !isAdmin) {
    return (
      <EcranMessage
        titre="Compte verrouillé"
        message="Ton accès a été suspendu par l'administrateur. Contacte-le pour plus d'informations."
        action={<button onClick={deconnexion} className="bg-slate-800 text-slate-300 text-xs rounded-lg py-2">Se déconnecter</button>}
      />
    );
  }

  if (!accesAutorise) {
    return (
      <EcranMessage
        titre="Essai gratuit terminé"
        message={`Ta période d'essai de ${dureeEssaiApplicable} jours est terminée. Passe à l'abonnement pour continuer à utiliser l'application.`}
        action={
          <div className="flex flex-col gap-2">
            <a href={LIEN_PAIEMENT} target="_blank" rel="noreferrer" className="bg-amber-500 text-slate-950 font-bold text-sm rounded-lg py-2.5">S'abonner</a>
            <button onClick={deconnexion} className="bg-slate-800 text-slate-300 text-xs rounded-lg py-2">Se déconnecter</button>
          </div>
        }
      />
    );
  }

  const joursRestantsEssai = (!isAdmin && userDoc?.freeAccess !== true)
    ? Math.max(0, Math.ceil(dureeEssaiApplicable - joursDepuis(userDoc?.createdAt)))
    : null;

  return <MonCarnetDeBord user={authUser} isAdmin={isAdmin} onLogout={deconnexion} joursRestantsEssai={joursRestantsEssai} />;
}

/* =========================================================================
   FILET DE SÉCURITÉ — empêche définitivement les "écrans noirs"
   Si une erreur inattendue survient dans l'interface, on affiche un message
   clair (avec le détail technique) plutôt qu'une page vide.
   ========================================================================= */
class GardeFou extends React.Component {
  constructor(props) {
    super(props);
    this.state = { erreur: null };
  }
  static getDerivedStateFromError(erreur) {
    return { erreur };
  }
  componentDidCatch(erreur, info) {
    console.error("Erreur interface :", erreur, info);
  }
  render() {
    if (this.state.erreur) {
      const msg = String(this.state.erreur?.message || this.state.erreur);
      const pile = String(this.state.erreur?.stack || "").split("\n").slice(0, 6).join("\n");
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 p-5 flex flex-col gap-4 font-sans">
          <h1 className="text-lg font-black text-amber-400">Un souci est survenu sur cet écran</h1>
          <p className="text-sm text-slate-300">
            Tes données sont bien enregistrées, rien n'est perdu. Recharge l'application pour continuer.
          </p>
          {/* Message affiché en clair : il suffit de le recopier pour signaler le problème */}
          <div className="bg-slate-900 border border-rose-800 rounded-xl p-3 flex flex-col gap-1">
            <span className="text-[11px] uppercase tracking-wide text-slate-500">Message d'erreur (à communiquer au support)</span>
            <p className="text-xs font-mono text-rose-300 break-words">{msg}</p>
            <pre className="text-[10px] font-mono text-slate-500 whitespace-pre-wrap mt-1">{pile}</pre>
          </div>
          <div className="flex gap-2 flex-wrap">
            <button onClick={() => window.location.reload()}
              className="bg-amber-500 text-slate-950 font-bold text-sm rounded-lg py-2.5 px-4">
              Recharger l'application
            </button>
            <button onClick={() => { try { navigator.clipboard.writeText(msg + "\n" + pile); } catch (e) {} }}
              className="bg-slate-800 border border-slate-600 text-slate-200 font-semibold text-sm rounded-lg py-2.5 px-4">
              Copier l'erreur
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/* Les erreurs asynchrones (hors rendu React) ne sont pas interceptées par les
   garde-fous ci-dessus : on les affiche donc dans un bandeau discret, pour
   qu'aucun problème ne reste invisible. */
(function surveillerErreurs() {
  const afficher = (texte) => {
    let zone = document.getElementById("bandeau-erreur");
    if (!zone) {
      zone = document.createElement("div");
      zone.id = "bandeau-erreur";
      zone.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7f1d1d;color:#fff;font:11px/1.4 monospace;padding:8px 34px 8px 10px;max-height:35vh;overflow:auto;white-space:pre-wrap";
      const fermer = document.createElement("button");
      fermer.textContent = "✕";
      fermer.style.cssText = "position:absolute;top:4px;right:8px;background:transparent;border:0;color:#fff;font-size:15px;cursor:pointer";
      fermer.onclick = () => zone.remove();
      zone.appendChild(fermer);
      document.body.appendChild(zone);
    }
    const ligne = document.createElement("div");
    ligne.textContent = texte;
    zone.appendChild(ligne);
  };
  window.addEventListener("error", (e) => {
    afficher(`Erreur : ${e.message} — ${e.filename || ""}:${e.lineno || "?"}`);
  });
  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason;
    afficher(`Erreur asynchrone : ${r && r.message ? r.message : String(r)}`);
  });
})();

const root = createRoot(document.getElementById("root"));
root.render(<GardeFou><AuthGate /></GardeFou>);
</script>
<script>
  (function () {
    var demarrage = document.getElementById("demarrage");
    var echec = function (titre, detail) {
      if (!demarrage) return;
      demarrage.innerHTML =
        '<div class="titre">Démarrage impossible</div>' +
        '<div class="sous" style="max-width:320px">' + titre + '</div>' +
        '<div class="sous" style="color:#475569;font-family:monospace;font-size:10px;max-width:320px">' + (detail || "") + '</div>';
    };

    // Vérifie que les bibliothèques sont bien chargées avant de démarrer :
    // sans cela, un fichier manquant se traduisait par un écran noir muet.
    var manquantes = [];
    if (!window.React) manquantes.push("React");
    if (!window.ReactDOM) manquantes.push("ReactDOM");
    if (!window.Babel) manquantes.push("Babel");
    if (!window.firebase) manquantes.push("Firebase");
    if (manquantes.length) {
      echec("Certains composants n'ont pas pu être chargés. Vérifie ta connexion, puis rouvre l'application.",
            "Manquant : " + manquantes.join(", "));
      return;
    }

    try {
      var source = document.getElementById("app-source").textContent;
      var compiled = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]]
      }).code;
      var script = document.createElement("script");
      script.textContent = compiled;
      document.body.appendChild(script);
      // L'application est affichée : on retire l'écran de démarrage.
      if (demarrage) demarrage.remove();
    } catch (err) {
      echec("Une erreur est survenue pendant la préparation de l'application.", String(err && err.message ? err.message : err));
    }
  })();
</script>
</body>
</html>
